name: Build all platforms

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # ---------------- Windows: setup.exe (CPU + GPU) ----------------
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Download ffmpeg static
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force desktop/bin | Out-Null
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName desktop/bin/ffmpeg.exe
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build
        shell: cmd
        run: desktop\packaging\windows\build_windows.bat ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup-${{ matrix.variant }}
          path: desktop/dist-installer/*.exe

  # ---------------- Linux: .deb + .rpm (CPU + GPU) ----------------
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install fpm + rpm tools
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev rpm build-essential
          sudo gem install fpm --no-document
      - name: Build
        run: bash desktop/packaging/linux/build_linux.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.variant }}
          path: desktop/dist-installer/*

  # ---------------- macOS: .dmg ----------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build dmg
        run: bash desktop/packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/dist-installer/*.dmg

  # ---------------- Android: .apk ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build apk
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org com.milan.whispersub
          flutter pub get
          sed -i 's/ndkVersion = .*/ndkVersion = "29.0.13113456"/' android/app/build.gradle.kts
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

  # ---------------- iOS: .ipa (chưa ký — cài qua Sideloadly/TrollStore) ----------------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build iOS (no codesign)
        working-directory: mobile
        run: |
          flutter create . --platforms=ios --org com.milan.whispersub
          flutter pub get
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.6'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.6/g' ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        working-directory: mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r WhisperSub-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile/WhisperSub-unsigned.ipa
